<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0f6f6a" />
  <title>HeartWise Connections</title>
  <meta name="description" content="A counsellor-guided relationship app for healthy dating and marriage. Healing first. Healthy relationships next." />
  <link rel="stylesheet" href="style.css" />
  <link rel="icon" type="image/png" sizes="64x64" href="icons/favicon-64.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png" />

  <!-- PWA -->
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icons/icon-180.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="HeartWise" />
  <meta name="mobile-web-app-capable" content="yes" />
</head>
<body>
  <!-- Phone frame is purely cosmetic on wide screens; the app fills the screen on mobile -->
  <div id="app-shell">
    <main id="screen" aria-live="polite"><!-- screens render here --></main>
    <nav id="tabbar" hidden>
      <button class="tab" data-nav="home"   aria-label="Home">
        <span class="tab-ico">🏠</span><span class="tab-txt">Home</span>
      </button>
      <button class="tab" data-nav="matches" aria-label="Matches">
        <span class="tab-ico">💞</span><span class="tab-txt">Matches</span>
      </button>
      <button class="tab" data-nav="messages" aria-label="Messages">
        <span class="tab-ico">💬</span><span class="tab-txt">Messages</span>
        <span class="tab-badge" id="msg-badge" hidden></span>
      </button>
      <button class="tab" data-nav="profile" aria-label="Profile">
        <span class="tab-ico">🌿</span><span class="tab-txt">You</span>
      </button>
    </nav>
  </div>

  <!-- Toast host -->
  <div id="toast" role="status" aria-live="polite"></div>

  <script src="data.js"></script>
  <script src="supabase-config.js"></script>
  <script src="backend.js"></script>
  <script src="app.js"></script>

  <!-- Register the service worker (installability + offline). Path is relative,
       so it works under the GitHub Pages subpath. -->
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("sw.js").catch((e) => console.warn("[pwa] SW registration failed", e));
      });
    }
  </script>
</body>
</html>
